<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoRL 2026 — All Events Summary · Nov 9–12 · Austin</title>
<link rel="stylesheet" href="assets/summary.css">
</head>
<body>
<header><div class="hin">
  <div class="htop">

<div id="searchbox">
  <input id="q" type="search" placeholder="search title, people, room, exhibitor…">
  <span id="qcount"></span>

  <button id="qnext" title="next match (Enter)">›</button>
</div>
  <div class="stats" id="stats"></div>

    <input id="favfile" type="file" accept=".json,application/json" hidden></div>
  </div>
  <div class="controls">
    <div class="seg tabs"><button id="tabsched" class="on">🗓 Schedule</button><button id="tabexpo">🗺 Exhibition</button><button id="tabrec">🤝 Recruiting</button></div>

  </div>
  <div class="controls schedonly">

    <div class="grp"><span class="lbl">Venue</span><span class="seg" id="venuebtns"></span></div>
  </div>
  <div class="controls picksrow">
    <div class="grp"><span class="lbl">Picks</span><button id="pickmode" class="pick" title="show only the hand-picked top picks (combines with the selected topics)">✦ Top picks only</button>
      <span class="topics" id="topicbtns"></span><button id="pickclear" class="topic" title="clear the picks filter">✕ clear</button></div>
  </div>
</div></header>
<div class="wrap" id="sched">
  <h2 id="mxhdr" class="fold"><span class="caret">▾</span> Program × Day overview <span class="sub">(checkbox shows/hides that program's events · click title to fold)</span></h2>
  <div class="matrix" id="mxbox"><table class="mx" id="mx"></table></div>
